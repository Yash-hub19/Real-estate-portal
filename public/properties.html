<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Properties | Keystone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="/index.html" class="brand">
            <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 17L16 6L28 17" stroke="#B8863B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 15V27H24V15" stroke="#F6F4EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="14" y="19" width="5" height="8" stroke="#B8863B" stroke-width="2"/>
            </svg>
            Keystone
        </a>
        <nav class="main-nav" id="main-nav">
            <a href="/properties.html" class="active">Properties</a>
            <a href="/properties.html?status=For+Sale">Buy</a>
            <a href="/properties.html?status=For+Rent">Rent</a>
            <div id="nav-user-slot"></div>
        </nav>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">&#9776;</button>
    </div>
</header>

<section class="section" style="padding-top:40px;">
    <div class="container">
        <div class="section-head">
            <div>
                <div class="section-eyebrow">Search</div>
                <h2>Browse properties</h2>
            </div>
        </div>

        <form class="search-card" id="filter-form" style="margin:0 0 32px;">
            <div class="search-grid">
                <div class="field">
                    <label for="f-location">Location</label>
                    <input id="f-location" name="location" placeholder="City or neighborhood">
                </div>
                <div class="field">
                    <label for="f-status">Buy / Rent</label>
                    <select id="f-status" name="status">
                        <option value="">Any</option>
                        <option value="For Sale">For Sale</option>
                        <option value="For Rent">For Rent</option>
                    </select>
                </div>
                <div class="field">
                    <label for="f-type">Property type</label>
                    <select id="f-type" name="type">
                        <option value="">Any</option>
                        <option value="House">House</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Villa">Villa</option>
                        <option value="Condo">Condo</option>
                        <option value="Land">Land</option>
                    </select>
                </div>
                <div class="field">
                    <label for="f-min">Min price</label>
                    <input id="f-min" name="minPrice" type="number" min="0" placeholder="0">
                </div>
                <div class="field">
                    <label for="f-max">Max price</label>
                    <input id="f-max" name="maxPrice" type="number" min="0" placeholder="No max">
                </div>
                <div class="field" style="align-self:end;">
                    <button type="submit" class="btn btn-primary btn-block">Filter</button>
                </div>
            </div>
        </form>

        <div class="flex justify-between items-center" style="margin-bottom:16px;">
            <span class="text-muted" id="results-meta"></span>
        </div>

        <div class="property-grid" id="listings-grid"></div>
        <div class="pagination" id="pagination"></div>
    </div>
</section>

<footer class="site-footer">
    <div class="container">
        <div>Keystone Real Estate Portal &middot; <span id="year"></span></div>
        <div>Built with Node, Express &amp; MongoDB</div>
    </div>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script src="/js/api.js"></script>
<script src="/js/properties.js"></script>
</body>
</html>
