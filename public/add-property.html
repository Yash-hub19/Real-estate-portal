<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List a Property | Keystone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="/index.html" class="brand">
            <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 17L16 6L28 17" stroke="#B8863B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 15V27H24V15" stroke="#F6F4EF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="14" y="19" width="5" height="8" stroke="#B8863B" stroke-width="2"/>
            </svg>
            Keystone
        </a>
        <nav class="main-nav" id="main-nav">
            <a href="/properties.html">Properties</a>
            <a href="/properties.html?status=For+Sale">Buy</a>
            <a href="/properties.html?status=For+Rent">Rent</a>
            <div id="nav-user-slot"></div>
        </nav>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">&#9776;</button>
    </div>
</header>

<section class="section" style="padding-top:40px;max-width:760px;margin:0 auto;">
    <div class="container">
        <div class="section-head">
            <div>
                <div class="section-eyebrow">Owner tools</div>
                <h2 id="form-heading">List a property</h2>
            </div>
        </div>

        <div class="form-error" id="property-error"></div>

        <form id="property-form" enctype="multipart/form-data">
            <div class="form-row">
                <label for="p-title">Title</label>
                <input id="p-title" name="title" required placeholder="Modern hillside villa">
            </div>

            <div class="form-row">
                <label for="p-description">Description</label>
                <textarea id="p-description" name="description" rows="5" required placeholder="Describe the property, its condition, and what makes it stand out."></textarea>
            </div>

            <div class="form-row form-grid-2">
                <div>
                    <label for="p-type">Property type</label>
                    <select id="p-type" name="type" required>
                        <option value="House">House</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Villa">Villa</option>
                        <option value="Condo">Condo</option>
                        <option value="Land">Land</option>
                    </select>
                </div>
                <div>
                    <label for="p-status">Listing status</label>
                    <select id="p-status" name="status" required>
                        <option value="For Sale">For Sale</option>
                        <option value="For Rent">For Rent</option>
                    </select>
                </div>
            </div>

            <div class="form-row form-grid-2">
                <div>
                    <label for="p-price">Price</label>
                    <input id="p-price" name="price" type="number" min="0" required placeholder="450000">
                </div>
                <div>
                    <label for="p-area">Area (sqft)</label>
                    <input id="p-area" name="area" type="number" min="0" required placeholder="1800">
                </div>
            </div>

            <div class="form-row form-grid-2">
                <div>
                    <label for="p-bedrooms">Bedrooms</label>
                    <input id="p-bedrooms" name="bedrooms" type="number" min="0" value="0">
                </div>
                <div>
                    <label for="p-bathrooms">Bathrooms</label>
                    <input id="p-bathrooms" name="bathrooms" type="number" min="0" value="0">
                </div>
            </div>

            <div class="form-row">
                <label for="p-location">Location</label>
                <input id="p-location" name="location" required placeholder="City, State">
            </div>

            <div class="form-row">
                <label for="p-address">Street address (optional)</label>
                <input id="p-address" name="address" placeholder="12 Hillside Lane">
            </div>

            <div class="form-row">
                <label for="images">Photos</label>
                <input id="images" name="images" type="file" accept="image/*" multiple>
                <div class="image-upload-preview" id="image-preview"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Publish listing</button>
        </form>
    </div>
</section>

<footer class="site-footer">
    <div class="container">
        <div>Keystone Real Estate Portal &middot; <span id="year"></span></div>
        <div>Built with Node, Express &amp; MongoDB</div>
    </div>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script src="/js/api.js"></script>
<script src="/js/add-property.js"></script>
</body>
</html>
